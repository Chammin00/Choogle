<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choogle History</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/choogle-mark.svg">
  <link rel="stylesheet" href="common.css">
  <style>
    .hist-list { display: flex; flex-direction: column; gap: 7px; }
    .hist-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
    }
    .hist-row:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
    .hist-meta { flex: 1; min-width: 0; }
    .hist-title { font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-url { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-time { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); flex-shrink: 0; }
  </style>
</head>
<body class="with-cosmic">
  <header class="page-topbar">
    <a class="page-brand" href="choogle://home">
      <img src="../assets/icons/choogle-32.png" alt="Choogle" width="22" height="22">
      <span>Choogle Browser</span>
    </a>
    <nav class="page-nav" id="hist-nav"></nav>
  </header>

  <main class="page-container">
    <div class="page-header">
      <div class="page-title-group">
        <h1>
          <span class="icon-badge" id="hist-title-icon"></span>
          <span>Browsing History</span>
        </h1>
        <p>Local navigation timeline stored strictly inside your Choogle Browser profile.</p>
      </div>
      <button id="clear-hist-btn" class="btn btn-danger">Clear All History</button>
    </div>

    <div style="margin-bottom:16px;">
      <input id="hist-search" class="input-field" style="width:100%;" type="text" placeholder="Search visited titles or URLs...">
    </div>

    <div id="hist-list" class="hist-list"></div>
  </main>

  <script src="../assets/icons/icon-library.js"></script>
  <script>
    (function () {
      const Icons = window.ChoogleIcons;
      const internal = window.choogleInternal;

      function esc(str) {
        return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function initNav() {
        const nav = [
          { label: 'Home', url: 'choogle://home', icon: 'nav-home' },
          { label: 'Bookmarks', url: 'choogle://bookmarks', icon: 'bookmark-filled' },
          { label: 'History', url: 'choogle://history', icon: 'history', active: true },
          { label: 'Downloads', url: 'choogle://downloads', icon: 'downloads' },
          { label: 'Settings', url: 'choogle://settings', icon: 'settings' }
        ];
        document.getElementById('hist-nav').innerHTML = nav
          .map((n) => `<a class="nav-pill${n.active ? ' active' : ''}" href="${n.url}">${Icons.svg(n.icon, { size: 14 })}<span>${n.label}</span></a>`)
          .join('');
        document.getElementById('hist-title-icon').innerHTML = Icons.svg('history', { size: 18 });
      }

      async function load() {
        const q = document.getElementById('hist-search').value;
        const items = internal && internal.isChoogleBrowser ? await internal.getHistory(q, 250) : [];
        const box = document.getElementById('hist-list');
        if (items.length === 0) {
          box.innerHTML = '<div class="surface-card" style="color:var(--text-muted);text-align:center;">No history entries recorded.</div>';
          return;
        }
        box.innerHTML = items
          .map((h) => `
            <div class="hist-row">
              <span class="icon-badge">${Icons.svg('history', { size: 15 })}</span>
              <div class="hist-meta">
                <div class="hist-title">${esc(h.title || h.url)}</div>
                <div class="hist-url">${esc(h.url)}</div>
              </div>
              <span class="hist-time">${new Date(h.visitedAt).toLocaleString()}</span>
              <button class="btn" data-open="${esc(h.url)}">Open</button>
              <button class="btn btn-danger" data-del="${esc(h.id)}">Delete</button>
            </div>
          `)
          .join('');
      }

      document.getElementById('hist-search').addEventListener('input', load);
      document.getElementById('clear-hist-btn').addEventListener('click', async () => {
        if (internal && internal.isChoogleBrowser) {
          await internal.clearHistory();
          await load();
        }
      });

      document.getElementById('hist-list').addEventListener('click', async (ev) => {
        const openBtn = ev.target.closest('[data-open]');
        if (openBtn && internal && internal.isChoogleBrowser) {
          internal.navigate(openBtn.dataset.open);
          return;
        }
        const delBtn = ev.target.closest('[data-del]');
        if (delBtn && internal && internal.isChoogleBrowser) {
          await internal.removeHistoryEntry(delBtn.dataset.del);
          await load();
        }
      });

      initNav();
      load();
    })();
  </script>
</body>
</html>
